<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.min.css">
    <title>Document</title>
</head>
<header>
    <div class="header__logobox">
        <img src="./imgs/logo.png" alt="logo" class="header__logo"/>
    </div>
    <div class="header__overlay"></div>
    <div class="container">
        <h2 class="header__title">FIND BEST EVENTS<br/>AROUND THE WORLD</h2>
        <div class="header__inputsBox">
            <div class="header__csearchBox">
                <input placeholder="Start searching" type="text" class="header__scearch"/>
                <img src="./imgs/scearch.svg" class="header__scearchIcon"/>
            </div>
            <div class="header__csearchBox">
                <input placeholder="Choose country" type="text" class="header__scearch"/>
                <img src="./imgs/down.svg" class="header__scearchIcon"/>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="events">
        <div class="container">
            <ul class="events__list">
            </ul>
        </div>
        .event__info
    </section>
</main>
<body>
    <script src="./app.js"></script>
</body>
</html>
